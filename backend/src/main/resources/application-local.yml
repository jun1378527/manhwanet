# 로컬 개발 프로필 (기본 활성 프로필)
# 저장소 루트의 .env 파일이 있으면 읽어 온다. OS 환경변수가 .env 보다 우선한다.
# 경로는 실행 디렉터리 기준이므로 backend/ 디렉터리에서 실행한다.
spring:
  config:
    import: optional:file:../.env[.properties]

server:
  # loopback 주소에만 바인딩해 외부 네트워크에서 접근할 수 없게 한다.
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        # HTTP(http://localhost) 개발용. __Host- 접두사는 Secure 가 필요하므로 쓰지 않는다.
        name: MANHWANET_SESSION
        secure: false
