# 테스트 프로필. 개발 DB와 분리된 테스트 전용 DB를 사용한다.
# local 프로필과 함께 활성화할 때는 test 를 마지막에 두어 이 datasource 설정이 우선하게 한다.
# TEST_DB_NAME 은 _test 로 끝나야 한다. 이 접미사는 안전장치이며, DB의 과거 용도를 증명하지 않는다.
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:manhwanet_test}
    hikari:
      # 테스트마다 여러 ApplicationContext 가 캐시되므로 커넥션 수를 줄인다.
      maximum-pool-size: 5
  jpa:
    properties:
      hibernate:
        # 쿼리 수 회귀 테스트(N+1 검증)용
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
