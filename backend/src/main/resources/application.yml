# 공통 설정. DB 접속 정보는 환경변수로만 주입한다. (비밀번호 기본값 없음)
spring:
  application:
    name: manhwanet
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:manhwanet}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 엔티티와 스키마 일치 여부만 검증한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # 서버 메모리 세션, 유휴 만료 30분 (remember-me 없음)
      timeout: 30m
      # URL 에 세션 ID 를 붙이지 않는다.
      tracking-modes: cookie
      cookie:
        # 운영 기본값. __Host- 접두사는 Secure, Path=/, Domain 없음을 브라우저가 강제한다.
        # local 프로필은 HTTP 개발용으로 이름과 Secure 를 바꾼다. (application-local.yml)
        name: __Host-MANHWANET_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

manhwanet:
  auth:
    login-limit:
      # 이메일 키당 15분 내 5회 실패 → 15분 거절(확정). 서버 메모리.
      # max-entries 46,000은 512MiB 측정(키당 922B, 10% 예산의 80%)의 초기값이다.
      # 가득 차면 신규 이메일 로그인만 503 AUTH_BUSY. 1GiB에서 다시 잴 때의 예시는 93,000(명세 §14.4).
      max-failures: 5
      window: 15m
      lock-duration: 15m
      max-entries: 46000
    # 로그인 검증·가입 해시 생성의 공통 부하 제한(잠정값, §5.2). 운영 장비에서 측정 후 조정한다.
    hash-limit:
      max-concurrent: 2
      max-waiting: 4
      max-wait: 250ms
